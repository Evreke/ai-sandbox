# Release — runs on every push to main (i.e. after a squash-merge).
# AGENTS.md contract: the HUMAN bumps version + changelog in a release PR;
# this workflow owns ONLY tagging: if package.json version is higher than the
# latest v* tag, rerun the suite, create the semver tag and a GitHub Release
# with notes extracted from the fresh CHANGELOG section. No version bump →
# no tag (docs-only merges land silently).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Serialize release runs: two near-simultaneous squash-merges to main each
# trigger this workflow; queue them instead of racing over the tag.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — needed for `git tag` comparison

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: an unrelated bun release must not flip the gate; bumps
          # are deliberate (change this line explicitly).
          bun-version: 1.4.2

      # Same as ci.yml: typebox is a peerDependency, the checkout has no
      # node_modules — without the install every check that spawns a bun
      # subprocess fails with a package-resolution error.
      - name: Install dependencies (frozen lockfile)
        working-directory: pi/extensions/pi-delegate
        run: bun install --frozen-lockfile

      # The tag must only ever point at green code: a squash-merge is a NEW
      # commit, so re-run the suite here even though the PR already passed CI.
      # Canonical runner (same protocol as ci.yml — see test/run-checks.sh):
      # per-file timeout, one env-flake retry, explicit ENV-FAIL verdict,
      # non-zero exit on any FAIL.
      - name: Run check suite on main before tagging
        working-directory: pi/extensions/pi-delegate
        run: ./test/run-checks.sh

      - name: Version sync (both package.json ship together)
        id: sync
        run: |
          root=$(node -p "require('./package.json').version")
          ext=$(node -p "require('./pi/extensions/pi-delegate/package.json').version")
          if [ "$root" != "$ext" ]; then
            echo "::error::version mismatch: root ($root) != extension ($ext) — refusing to tag"
            exit 1
          fi
          echo "version=$root" >> "$GITHUB_OUTPUT"

      - name: Decide whether a tag is needed
        id: need
        run: |
          version="${{ steps.sync.outputs.version }}"
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          echo "version=$version latest_tag=${latest:-none}"
          if [ -z "$latest" ]; then
            echo "need=true" >> "$GITHUB_OUTPUT" # first release
          elif [ "$version" = "${latest#v}" ]; then
            echo "need=false" >> "$GITHUB_OUTPUT" # no bump — docs-only merge
          elif [ "$(printf '%s\n%s\n' "$version" "${latest#v}" | sort -V | tail -1)" = "$version" ]; then
            echo "need=true" >> "$GITHUB_OUTPUT" # semver increment
          else
            echo "::error::package.json version ($version) is LOWER than the latest tag ($latest) — a bump was lost or reverted; fix the version in a fix/ PR"
            exit 1
          fi

      - name: Extract fresh CHANGELOG section (release notes)
        if: steps.need.outputs.need == 'true'
        id: notes
        run: |
          version="${{ steps.sync.outputs.version }}"
          body=$(awk -v ver="[$version]" '
            /^## \[/ { if (found) exit; if (index($0, ver) != 0) { found=1; print; next } }
            found { print }
          ' pi/extensions/pi-delegate/CHANGELOG.md)
          if [ -z "$body" ]; then
            echo "::error::no CHANGELOG section for [$version] — the release PR must add one (Keep a Changelog format)"
            exit 1
          fi
          {
            echo "body<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create semver tag
        if: steps.need.outputs.need == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tag="v${{ steps.sync.outputs.version }}"
          # Race hygiene: two near-simultaneous merges queue via the
          # concurrency group, but a tag can still pre-exist (re-run of the
          # workflow, manual tag, replay). "Tag already exists" must be a
          # no-op success, not a red main.
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "refs/tags/$tag$"; then
            echo "::notice::$tag already exists on the remote — treating as a no-op success"
            exit 0
          fi
          git tag -a "$tag" -m "Release $tag"
          if ! git push origin "refs/tags/$tag"; then
            # Push rejected: another run may have created the very same tag
            # between our check and our push. If the remote tag object is
            # byte-identical to ours (same commit, same annotated object —
            # deterministic from this merge commit), the other run won and
            # this is success. Anything else is a real failure.
            remote_obj=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
            local_obj=$(git rev-parse "$tag")
            if [ -n "$remote_obj" ] && [ "$remote_obj" = "$local_obj" ]; then
              echo "::notice::$tag was created by a concurrent release run with an identical object — treating as a no-op success"
              exit 0
            fi
            echo "::error::tag push failed and the remote tag differs from ours (remote: ${remote_obj:-absent}, local: $local_obj)"
            exit 1
          fi

      - name: Create GitHub Release
        if: steps.need.outputs.need == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.sync.outputs.version }}"
          name: "v${{ steps.sync.outputs.version }}"
          body: "${{ steps.notes.outputs.body }}"
